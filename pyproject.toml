[project]
name = "sift"
version = "0.1.0"
description = "Scan Python codebases, score functions for quality, and curate ranked datasets for ML fine-tuning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sift Contributors" }]
keywords = ["code-quality", "ml", "fine-tuning", "dataset", "cli"]
dependencies = [
    "click>=8.1",
    "radon>=6.0",
    "ruff>=0.4",
    "gitpython>=3.1",
    # Keep tree-sitter core/grammars on the same 0.23 ABI generation:
    # newer core with stale grammar wheels can segfault instead of raising.
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sift = "sift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
